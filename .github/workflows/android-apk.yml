name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import and validate project
        run: godot --headless --path . --editor --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/StrikeOnline-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StrikeOnline-debug
          path: build/StrikeOnline-debug.apk
          if-no-files-found: error
          retention-days: 14
